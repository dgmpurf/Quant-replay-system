project:
  name: quant-replay-system
  timezone: Asia/Shanghai
  market: China A-share

data:
  root: data
  mock_prices: data/mock/prices.csv
  mock_universe_snapshots: data/mock/universe_snapshots.csv
  mock_corporate_actions: data/mock/corporate_actions.csv
  mock_trading_calendar: data/mock/trading_calendar.csv

output:
  root: outputs
  reports: outputs/reports

scoring:
  weights:
    momentum_20d: 0.40
    liquidity: 0.30
    volatility_penalty: -0.30
  min_score: 0.0
  max_candidates: 5

factor_dataset:
  exclude_st: true
  exclude_suspended: true
  require_market_data: true
  include_technical_score: true

score_engine:
  weights:
    reality_score: 0.35
    technical_score: 0.25
    expectation_score: 0.15
    liquidity_score: 0.10
    sentiment_score: 0.05
    risk_penalty: 0.25
  reality_score_default: 50
  sentiment_score_default: 50
  technical_score_default: 50
  expectation_score_default: 50
  liquidity_score_default: 0
  rsi_overheat_threshold: 80
  hard_block_st: true
  hard_block_suspended: true
  hard_block_missing_market: true
  hard_block_limit_up: true

candidate_selection:
  top_n: 5
  min_action: PAPER_TRADE
  min_final_score:
  exclude_blocked: true

current_candidates:
  output_dir: outputs/reports/current_candidates
  default_top_n: 10
  min_final_score: 70
  min_action: PAPER_TRADE
  enable_snapshot_quality_preflight: true
  config_version: mvp
  write_artifacts: true
  enable_live_trading: false
  enable_broker_api: false

current_candidate_artifact_index:
  root_dir: outputs/reports/current_candidates
  output_dir: outputs/reports/current_candidates/index
  include_missing_metadata: false
  config_version: mvp
  write_artifacts: true
  enable_live_trading: false
  enable_broker_api: false

current_candidate_artifact_health:
  index_path: outputs/reports/current_candidates/index/current_candidate_artifact_index.csv
  root_dir: outputs/reports/current_candidates
  output_dir: outputs/reports/current_candidates/health
  strict: false
  empty_candidates_severity: WARN
  missing_no_live_statement_severity: WARN
  missing_metadata_field_severity: WARN
  config_version: mvp
  write_artifacts: true
  enable_live_trading: false
  enable_broker_api: false

current_to_paper_handoff:
  output_dir: outputs/reports/current_to_paper_handoff
  require_health_pass: true
  allow_health_warn: false
  prefer_latest: true
  default_paper_date_from_decision_date: true
  config_version: mvp
  write_artifacts: true
  enable_live_trading: false
  enable_broker_api: false

current_to_paper_review_handoff:
  output_dir: outputs/reports/current_to_paper_review_handoff
  default_reviewer_id: ""
  default_manual_review_status: PENDING_REVIEW
  include_suggested_status: true
  auto_approve_above_score:
  auto_reject_below_score:
  config_version: mvp
  write_artifacts: true
  enable_live_trading: false
  enable_broker_api: false

replay_run:
  default_top_n: 5
  default_holding_horizon: 10
  output_dir: outputs/reports
  min_action: PAPER_TRADE
  min_final_score: 70
  config_version: mvp
  write_artifacts: true

batch_replay:
  output_dir: outputs/reports/batch_replays
  skip_non_trading_days: true
  fail_fast: false
  default_top_n: 5
  default_holding_horizon: 10
  enable_portfolio_simulation: true
  portfolio_initial_cash: 10000
  portfolio_max_gross_exposure: 0.60
  portfolio_max_position_weight: 0.20
  portfolio_reserve_cash_pct: 0.40
  config_version: mvp
  write_artifacts: true

calibration:
  output_dir: outputs/reports/calibrations
  default_top_n_values: [3, 5]
  default_holding_horizon_values: [3, 5]
  default_min_final_score_values: [60, 70]
  default_min_action: PAPER_TRADE
  min_trade_count: 3
  max_parameter_sets: 40
  use_portfolio_metrics: true
  objective_metric_mode: portfolio_aware
  config_version: mvp
  write_artifacts: true

portfolio_simulation:
  output_dir: outputs/reports/portfolio_simulations
  initial_cash: 10000
  max_gross_exposure: 0.60
  max_position_weight: 0.20
  sizing_method: equal_weight
  round_lots: true
  lot_size: 100
  allow_fractional_shares: false
  reserve_cash_pct: 0.40
  commission_bps: 0
  min_commission: 0
  slippage_bps: 0
  tax_bps: 0
  allow_reinvestment: true
  mark_to_market: true
  allow_negative_cash: false
  config_version: mvp
  write_artifacts: true

walk_forward:
  output_dir: outputs/reports/walk_forward
  require_validation: true
  require_test: false
  overfit_warning_threshold: 0.50
  severe_overfit_threshold: 0.75
  min_train_dates: 3
  min_validation_dates: 1
  min_test_dates: 0
  config_version: mvp
  write_artifacts: true

paper_trading:
  output_dir: outputs/reports/paper_trading
  initial_paper_cash: 10000
  default_lot_size: 100
  round_lots: true
  allow_fractional_shares: false
  allow_short_selling: false
  require_approved_decision_for_fills: true
  prevent_negative_cash: true
  default_fee_bps: 0
  default_slippage_bps: 0
  enable_live_trading: false
  enable_broker_api: false
  fail_daily_report_on_reconciliation_error: false
  config_version: mvp
  write_artifacts: true

paper_reconciliation:
  output_dir: outputs/reports/paper_trading/reconciliation
  duplicate_fill_id_severity: WARN
  negative_cash_severity: ERROR
  config_version: mvp
  write_artifacts: true
  enable_live_trading: false
  enable_broker_api: false

paper_review:
  output_dir: outputs/reports/paper_trading/reviews
  allow_pending_reviews: true
  enable_template_health_check: false
  require_template_health_pass: false
  allow_template_health_warn: true
  config_version: mvp
  write_artifacts: true
  enable_live_trading: false
  enable_broker_api: false

paper_review_template_health:
  output_dir: outputs/reports/paper_trading/review_template_health
  duplicate_update_severity: ERROR
  invalid_reason_code_severity: WARN
  missing_reviewer_severity: WARN
  blank_status_severity: ERROR
  approve_non_pass_risk_severity: WARN
  low_score_approval_threshold: 70
  low_score_approval_severity: WARN
  high_score_threshold: 80
  rejected_high_score_severity: INFO
  watch_high_score_severity: INFO
  require_decisions_for_id_validation: false
  strict: false
  config_version: mvp
  write_artifacts: true
  enable_live_trading: false
  enable_broker_api: false

daily_paper_runner:
  output_dir: outputs/reports/paper_trading/daily
  error_on_both_candidates_and_reviewed_decisions: false
  config_version: mvp
  write_artifacts: true
  enable_live_trading: false
  enable_broker_api: false

paper_artifact_index:
  root_dir: outputs/reports/paper_trading
  output_dir: outputs/reports/paper_trading/index
  include_missing_metadata: false
  artifact_type: all
  config_version: mvp
  write_artifacts: true
  enable_live_trading: false
  enable_broker_api: false

paper_artifact_health:
  index_path: outputs/reports/paper_trading/index/paper_artifact_index.csv
  root_dir: outputs/reports/paper_trading
  output_dir: outputs/reports/paper_trading/health
  strict: false
  empty_csv_severity: WARN
  missing_no_live_statement_severity: WARN
  missing_metadata_field_severity: WARN
  config_version: mvp
  write_artifacts: true
  enable_live_trading: false
  enable_broker_api: false

paper_workflow_status:
  root_dir: outputs/reports
  current_candidates_root: outputs/reports/current_candidates
  paper_trading_root: outputs/reports/paper_trading
  output_dir: outputs/reports/paper_trading/workflow_status
  strict: false
  config_version: mvp
  write_artifacts: true
  enable_live_trading: false
  enable_broker_api: false

data_sources:
  default_source: LOCAL_CSV
  raw_output_dir: data/raw
  allow_network_sources: false
  allow_real_data_fetch: false
  require_manual_real_data_flag: true
  default_revision_id: v1
  default_source_name: LOCAL_CSV
  config_version: mvp
  write_artifacts: true
  enable_live_trading: false
  enable_broker_api: false

data_pipeline:
  output_dir: outputs/reports/data_pipeline
  raw_output_dir: data/raw
  processed_output_dir: data/processed
  snapshot_output_dir: data/snapshots
  run_data_quality: true
  build_snapshot_manifest: true
  fail_on_ingestion_error: true
  fail_on_data_quality_fail: false
  allow_data_quality_warn: true
  allow_real_data: false
  config_version: mvp
  write_artifacts: true
  enable_live_trading: false
  enable_broker_api: false

data_ingestion:
  output_dir: data/processed
  snapshot_dir: data/snapshots
  allow_default_available_time: true
  allow_default_corporate_action_available_time: false
  default_source: LOCAL_CSV
  default_revision_id: v1
  exchange_timezone: Asia/Shanghai
  duplicate_key_severity: WARN
  config_version: mvp
  write_artifacts: true
  enable_live_trading: false
  enable_broker_api: false

data_quality:
  output_dir: outputs/reports/data_quality
  duplicate_key_severity: WARN
  missing_available_time_severity: ERROR
  missing_source_revision_severity: WARN
  suspicious_available_time_severity: WARN
  strict: false
  config_version: mvp
  write_artifacts: true
  enable_live_trading: false
  enable_broker_api: false

snapshot_quality_gate:
  output_dir: outputs/reports/snapshot_quality
  required_datasets:
    - market
    - universe
    - trading_calendar
  optional_datasets:
    - benchmark
    - corporate_actions
  fail_on_required_dataset_warn: false
  fail_on_optional_dataset_fail: false
  allow_missing_optional_datasets: true
  missing_optional_dataset_severity: INFO
  block_replay_on_fail: true
  config_version: mvp
  write_artifacts: true
  enable_live_trading: false
  enable_broker_api: false

snapshot_quality_preflight:
  enabled: false
  manifest_path:
  block_on_fail: true
  block_on_warn: false
  attach_report_paths: true
  config_version: mvp
  enable_live_trading: false
  enable_broker_api: false

execution:
  mode: t_plus_1
  price_field: open
  slippage_bps: 0.0
  max_exit_delay_trading_days: 5
  block_buy_on_limit_up: true
  block_sell_on_limit_down: true
  default_slippage_bps: 10
  default_holding_horizon_trading_days: 1

risk:
  max_single_position_pct: 0.20
  max_drawdown_stop_pct: 0.12
  allow_live_trading: false
