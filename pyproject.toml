[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-replay-system"
version = "0.1.0"
description = "Point-in-time historical replay quant research system for China A-share ETFs and stocks."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=1.5,<3",
  "numpy>=1.23",
  "pydantic>=1.10",
  "PyYAML>=6.0",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "unit: fast isolated tests with narrow module scope",
  "integration: multi-module tests or artifact/report workflow checks",
  "e2e: end-to-end workflow smoke tests",
  "slow: tests that write many artifacts, run long workflows, or are expected to be slower",
]
